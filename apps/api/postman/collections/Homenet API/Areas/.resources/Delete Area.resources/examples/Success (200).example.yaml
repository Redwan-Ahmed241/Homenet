$kind: http-example
request:
  url: http://localhost:3000/areas/{{areaId}}
  method: DELETE
  headers:
    Authorization: Bearer <access_token>
  pathVariables:
    areaId: uuid-of-area
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "OK",
        "data": {
          "message": "Area deleted successfully"
        }
      }
order: 1000
