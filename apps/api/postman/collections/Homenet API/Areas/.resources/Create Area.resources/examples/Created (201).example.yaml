$kind: http-example
request:
  url: http://localhost:3000/areas
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer <access_token>
  body:
    type: json
    content: |-
      {
        "name": "New Area",
        "city": "Dhaka",
        "parent_area_id": "uuid-of-parent-area"
      }
response:
  statusCode: 201
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "OK",
        "data": {
          "id": "uuid-of-new-area",
          "name": "New Area",
          "parent_area_id": "uuid-of-parent-area",
          "city": "Dhaka",
          "created_at": "2026-07-05T10:00:00.000Z",
          "updated_at": "2026-07-05T10:00:00.000Z"
        }
      }
order: 1000
