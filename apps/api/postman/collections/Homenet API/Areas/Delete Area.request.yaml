$kind: http-request
description: Deletes an area. Blocked if area has active property listings.
  Requires manage_areas permission.
url: http://localhost:3000/areas/{{areaId}}
method: DELETE
headers:
  Authorization: Bearer <access_token>
pathVariables:
  areaId: uuid-of-area
examples: ./.resources/Delete Area.resources/examples
order: 6000
