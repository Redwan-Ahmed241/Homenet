$kind: http-example
request:
  url: http://localhost:3000/v1/properties/{{propertyId}}/admin
  method: DELETE
  headers:
    Authorization: Bearer <access_token>
  pathVariables:
    propertyId: uuid-of-property
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "OK",
        "data": null
      }
order: 1000
