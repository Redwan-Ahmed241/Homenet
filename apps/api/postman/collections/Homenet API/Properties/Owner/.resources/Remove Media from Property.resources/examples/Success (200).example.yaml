$kind: http-example
request:
  url: http://localhost:3000/v1/properties/media/{{mediaId}}
  method: DELETE
  headers:
    Authorization: Bearer <access_token>
  pathVariables:
    mediaId: uuid-of-media
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "OK",
        "data": null
      }
order: 1000
