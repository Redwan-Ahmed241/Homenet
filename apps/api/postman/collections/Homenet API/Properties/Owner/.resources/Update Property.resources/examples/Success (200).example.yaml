$kind: http-example
request:
  url: http://localhost:3000/v1/properties/{{propertyId}}
  method: PATCH
  headers:
    Content-Type: application/json
    Authorization: Bearer <access_token>
  pathVariables:
    propertyId: uuid-of-property
  body:
    type: json
    content: |-
      {
        "title": "Updated Title - Now With Better Description",
        "price": 95000
      }
