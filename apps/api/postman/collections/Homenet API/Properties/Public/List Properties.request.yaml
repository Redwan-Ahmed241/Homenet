$kind: http-request
description: Returns paginated active property listings with optional filters
  and proximity search. No auth required.
url: http://localhost:3000/properties?page=1&limit=20
method: GET
queryParams:
  - key: page
    value: "1"
    description: "Page number (default: 1)"
  - key: limit
    value: "20"
    description: "Items per page (default: 20, max: 100)"
  - key: city
    value: ""
    disabled: true
    description: Filter by city name
  - key: area_id
    value: ""
    disabled: true
    description: Filter by area UUID
  - key: type
    value: ""
    disabled: true
    description: "Property type: residential, commercial, land, parking"
  - key: listing_type
    value: ""
    disabled: true
    description: "Listing type: sale, rent"
  - key: min_price
    value: ""
    disabled: true
    description: Minimum price filter
  - key: max_price
    value: ""
    disabled: true
    description: Maximum price filter
  - key: min_area
    value: ""
    disabled: true
    description: Minimum area size
  - key: max_area
    value: ""
    disabled: true
    description: Maximum area size
  - key: bedrooms
    value: ""
    disabled: true
    description: Filter by bedrooms
  - key: bathrooms
    value: ""
    disabled: true
    description: Filter by bathrooms
  - key: search
    value: ""
    disabled: true
    description: Case-insensitive search on title/description
  - key: is_verified
    value: ""
    disabled: true
    description: Filter by verification status
  - key: sort_by
    value: ""
    disabled: true
    description: "Sort: price_asc, price_desc, created_at_asc, created_at_desc,
      view_count_desc"
  - key: lat
    value: ""
    disabled: true
    description: Latitude for proximity search
  - key: lng
    value: ""
    disabled: true
    description: Longitude for proximity search
  - key: radius
    value: ""
    disabled: true
    description: "Search radius in km (max: 50)"
examples: ./.resources/List Properties.resources/examples
order: 1000
