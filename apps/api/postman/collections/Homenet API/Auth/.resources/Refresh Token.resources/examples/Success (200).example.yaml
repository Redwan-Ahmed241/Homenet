$kind: http-example
request:
  url: http://localhost:3000/v1/auth/refresh
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "refresh_token": "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "OK",
        "data": {
          "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "refresh_token": "new-uuid-refresh-token"
        }
      }
order: 1000
