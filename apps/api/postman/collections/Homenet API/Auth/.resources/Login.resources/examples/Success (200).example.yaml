$kind: http-example
request:
  url: http://localhost:3000/v1/auth/login
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "john@example.com",
        "password": "StrongP@ss123"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "OK",
        "data": {
          "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "refresh_token": "new-uuid-refresh-token",
          "user": {
            "id": "uuid-of-user",
            "full_name": "John Doe",
            "email": "john@example.com",
            "avatar_url": null
          }
        }
      }
order: 1000
