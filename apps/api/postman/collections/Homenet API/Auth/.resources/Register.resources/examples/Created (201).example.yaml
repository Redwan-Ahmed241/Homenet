$kind: http-example
request:
  url: http://localhost:3000/auth/register
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "full_name": "John Doe",
        "email": "john@example.com",
        "password": "StrongP@ss123"
      }
response:
  statusCode: 201
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "OK",
        "data": {
          "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "refresh_token": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
          "user": {
            "id": "uuid-of-new-user",
            "full_name": "John Doe",
            "email": "john@example.com",
            "avatar_url": null
          }
        }
      }
order: 1000
