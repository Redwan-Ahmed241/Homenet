$kind: http-request
name: Register
description: "Creates a new user account with email/password. Optional field: avatar_url."
url: "{{base_url}}/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "{{full_name}}",
      "email": "{{email}}",
      "password": "{{password}}"
    }
examples: ./.resources/Register.resources/examples
order: 1000
