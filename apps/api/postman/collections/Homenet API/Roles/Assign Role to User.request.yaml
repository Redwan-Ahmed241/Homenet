$kind: http-request
description: Assigns a role to a user. Requires manage_roles permission.
url: http://localhost:3000/roles/assign
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer <access_token>
body:
  type: json
  content: |-
    {
      "userId": "uuid-of-user",
      "roleId": "uuid-of-role"
    }
examples: ./.resources/Assign Role to User.resources/examples
order: 4000
