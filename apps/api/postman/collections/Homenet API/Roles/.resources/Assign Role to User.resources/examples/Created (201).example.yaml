$kind: http-example
request:
  url: http://localhost:3000/v1/roles/assign
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer <access_token>
  body:
    type: json
    content: |-
      {
        "userId": "uuid-of-user",
        "roleId": "uuid-of-role"
      }
response:
  statusCode: 201
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "OK",
        "data": {
          "id": "uuid-of-user-role",
          "user_id": "uuid-of-user",
          "role_id": "uuid-of-role",
          "assigned_by": null,
          "created_at": "2026-06-30T10:00:00.000Z"
        }
      }
order: 1000
