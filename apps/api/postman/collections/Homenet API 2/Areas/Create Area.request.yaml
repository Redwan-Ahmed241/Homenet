$kind: http-request
description: "Creates a new area. Requires manage_areas permission. Optional
  fields: parent_area_id, city, boundary (WKT), centroid (WKT)."
url: http://localhost:3000/areas
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer <access_token>
body:
  type: json
  content: |-
    {
      "name": "New Area",
      "city": "Dhaka",
      "parent_area_id": "uuid-of-parent-area"
    }
examples: ./.resources/Create Area.resources/examples
order: 4000
