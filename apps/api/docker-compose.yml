services:
  # ── PostgreSQL ──────────────────────────────────────────────
  homenet-postgres-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homenet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homenet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NestJS API ──────────────────────────────────────────────
  homenet-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: homenet-api:1.0.0
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      homenet-postgres-db:
        condition: service_healthy

volumes:
  pgdata:
